apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-sre-config
  namespace: ai-sre-stack
  labels:
    app: ai-sre-orchestrator
data:
  # ========================================
  # ORCHESTRATION SETTINGS
  # ========================================
  OBSERVATION_INTERVAL: "60"
  DRY_RUN: "false"
  AUTO_REMEDIATION: "true"
  
  # ========================================
  # SECURITY CONTROLS
  # ========================================
  
  # Action Whitelisting
  SECURITY_ENABLE_ACTION_WHITELIST: "true"
  
  # Rate Limiting
  SECURITY_ENABLE_RATE_LIMITING: "true"
  SECURITY_MAX_ACTIONS_PER_MINUTE: "10"
  SECURITY_MAX_ACTIONS_PER_HOUR: "100"
  SECURITY_MAX_ACTIONS_PER_DAY: "500"
  
  # Audit Logging
  SECURITY_ENABLE_AUDIT_LOGGING: "true"
  SECURITY_AUDIT_LOG_PATH: "/app/logs/audit.jsonl"
  SECURITY_MASK_SENSITIVE: "true"
  
  # Approval Workflow
  SECURITY_ENABLE_APPROVAL_WORKFLOW: "true"
  SECURITY_REQUIRE_APPROVAL_FOR_HIGH_RISK: "true"
  SECURITY_REQUIRE_APPROVAL_FOR_CRITICAL: "true"
  SECURITY_AUTO_APPROVE_LOW_SEVERITY: "true"
  
  # ========================================
  # MCP SERVER CONFIGURATIONS
  # ========================================
  
  # Kubernetes
  K8S_NAMESPACE: "default"
  
  # AWS
  AWS_REGION: "us-east-1"
  
  # Datadog
  DATADOG_SITE: "datadoghq.com"
  
  # GitHub
  GITHUB_ORG: "your-org"
  GITHUB_REPO: "your-repo"
  
  # Argo CD
  ARGOCD_SERVER: "argocd-server.argocd.svc.cluster.local"
  
  # Slack
  SLACK_CHANNEL: "#sre-alerts"
  
  # Runbook
  RUNBOOK_PATH: "/app/runbooks"
  
  # Vault
  VAULT_URL: "http://vault.vault.svc.cluster.local:8200"
  VAULT_MOUNT_POINT: "secret"
  
  # CloudTrail
  CLOUDTRAIL_TRAIL_NAME: ""  # Optional
