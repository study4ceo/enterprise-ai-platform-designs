# IMPORTANT: This is an example secrets file
# DO NOT commit actual secrets to git!
# 
# For production, use one of these:
# 1. Sealed Secrets: https://github.com/bitnami-labs/sealed-secrets
# 2. External Secrets Operator: https://external-secrets.io/
# 3. Vault integration
# 4. Cloud provider secrets (AWS Secrets Manager, Azure Key Vault, GCP Secret Manager)

apiVersion: v1
kind: Secret
metadata:
  name: ai-sre-secrets
  namespace: ai-sre-stack
  labels:
    app: ai-sre-orchestrator
type: Opaque
stringData:
  # Anthropic
  ANTHROPIC_API_KEY: "REPLACE_WITH_YOUR_KEY"
  
  # AWS
  AWS_ACCESS_KEY_ID: "REPLACE_WITH_YOUR_KEY"
  AWS_SECRET_ACCESS_KEY: "REPLACE_WITH_YOUR_SECRET"
  
  # Kubernetes (if accessing external cluster)
  # KUBECONFIG: "base64-encoded-kubeconfig-content"
  
  # Datadog
  DATADOG_API_KEY: "REPLACE_WITH_YOUR_KEY"
  DATADOG_APP_KEY: "REPLACE_WITH_YOUR_KEY"
  
  # PagerDuty
  PAGERDUTY_API_KEY: "REPLACE_WITH_YOUR_KEY"
  PAGERDUTY_SERVICE_ID: "REPLACE_WITH_YOUR_ID"
  
  # GitHub
  GITHUB_TOKEN: "REPLACE_WITH_YOUR_TOKEN"
  
  # Argo CD
  ARGOCD_TOKEN: "REPLACE_WITH_YOUR_TOKEN"
  
  # Slack
  SLACK_BOT_TOKEN: "REPLACE_WITH_YOUR_TOKEN"
  
  # Vault
  VAULT_TOKEN: "REPLACE_WITH_YOUR_TOKEN"

---
# Example: Using Sealed Secrets (recommended for production)
# 
# 1. Install sealed-secrets controller:
#    kubectl apply -f https://github.com/bitnami-labs/sealed-secrets/releases/download/v0.24.0/controller.yaml
#
# 2. Create secret and seal it:
#    kubectl create secret generic ai-sre-secrets \
#      --namespace=ai-sre-stack \
#      --from-literal=ANTHROPIC_API_KEY=your-key \
#      --dry-run=client -o yaml | \
#    kubeseal -o yaml > sealed-secrets.yaml
#
# 3. Apply sealed secret:
#    kubectl apply -f sealed-secrets.yaml
