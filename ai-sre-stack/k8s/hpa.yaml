# HorizontalPodAutoscaler for AI SRE Orchestrator
# (Optional - for future when implementing leader election and horizontal scaling)

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ai-sre-orchestrator-hpa
  namespace: ai-sre-stack
  labels:
    app: ai-sre-orchestrator
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ai-sre-orchestrator
  
  minReplicas: 1
  maxReplicas: 5
  
  metrics:
  # Scale based on CPU utilization
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  
  # Scale based on memory utilization
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300  # Wait 5 minutes before scaling down
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
      - type: Pods
        value: 1
        periodSeconds: 60
      selectPolicy: Min
    
    scaleUp:
      stabilizationWindowSeconds: 60  # Wait 1 minute before scaling up
      policies:
      - type: Percent
        value: 100
        periodSeconds: 60
      - type: Pods
        value: 2
        periodSeconds: 60
      selectPolicy: Max

---
# Note: HPA requires metrics-server to be installed
# 
# Install metrics-server:
# kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml
#
# Verify metrics-server:
# kubectl top nodes
# kubectl top pods -n ai-sre-stack
#
# WARNING: Current implementation is stateful (single instance recommended)
# For HPA to work properly, you need to implement:
# 1. Leader election
# 2. Work distribution
# 3. State synchronization
