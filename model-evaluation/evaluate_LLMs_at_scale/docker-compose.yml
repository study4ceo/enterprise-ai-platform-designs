version: '3.8'

services:
  # PostgreSQL with pgvector and TimescaleDB
  postgres:
    image: timescale/timescaledb-ha:pg16
    container_name: llm-eval-postgres
    environment:
      POSTGRES_DB: llm_evaluation
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for caching and rate limiting
  redis:
    image: redis:7-alpine
    container_name: llm-eval-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # RabbitMQ for message queue
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: llm-eval-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  # MinIO for object storage
  minio:
    image: minio/minio:latest
    container_name: llm-eval-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  # API Gateway
  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    container_name: llm-eval-api-gateway
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/llm_evaluation
      - REDIS_URL=redis://redis:6379
      - RABBITMQ_URL=amqp://admin:admin@rabbitmq:5672/
      - JWT_SECRET=your-secret-key-change-in-production
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./services/api-gateway:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  # Orchestrator Service
  orchestrator:
    build:
      context: ./services/orchestrator
      dockerfile: Dockerfile
    container_name: llm-eval-orchestrator
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/llm_evaluation
      - REDIS_URL=redis://redis:6379
      - RABBITMQ_URL=amqp://admin:admin@rabbitmq:5672/
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./services/orchestrator:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8001

  # Gemini Worker
  worker-gemini:

    build:
      context: ./services/workers
      dockerfile: Dockerfile
    container_name: llm-eval-worker-gemini
    environment:
      - WORKER_TYPE=gemini
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - REDIS_URL=redis://redis:6379
      - RABBITMQ_URL=amqp://admin:admin@rabbitmq:5672/
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/llm_evaluation
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./services/workers:/app
    command: python worker.py gemini
    deploy:
      replicas: 2

  # GPT Worker
  worker-gpt:
    build:
      context: ./services/workers
      dockerfile: Dockerfile
    container_name: llm-eval-worker-gpt
    environment:
      - WORKER_TYPE=gpt
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - REDIS_URL=redis://redis:6379
      - RABBITMQ_URL=amqp://admin:admin@rabbitmq:5672/
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/llm_evaluation
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./services/workers:/app
    command: python worker.py gpt
    deploy:
      replicas: 2

  # Groq Worker (Fast & Cheap!)
  worker-groq:
    build:
      context: ./services/workers
      dockerfile: Dockerfile
    container_name: llm-eval-worker-groq
    environment:
      - WORKER_TYPE=groq
      - GROQ_API_KEY=${GROQ_API_KEY}
      - REDIS_URL=redis://redis:6379
      - RABBITMQ_URL=amqp://admin:admin@rabbitmq:5672/
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/llm_evaluation
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./services/workers:/app
    command: python groq_worker.py
    deploy:
      replicas: 3

  # Metrics Service
  metrics-service:
    build:
      context: ./services/metrics
      dockerfile: Dockerfile
    container_name: llm-eval-metrics
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/llm_evaluation
      - REDIS_URL=redis://redis:6379
      - RABBITMQ_URL=amqp://admin:admin@rabbitmq:5672/
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./services/metrics:/app
    command: python main.py

  # Storage Service
  storage-service:
    build:
      context: ./services/storage
      dockerfile: Dockerfile
    container_name: llm-eval-storage
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/llm_evaluation
      - REDIS_URL=redis://redis:6379
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
    ports:
      - "8002:8002"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./services/storage:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8002

  # Analytics Service
  analytics-service:
    build:
      context: ./services/analytics
      dockerfile: Dockerfile
    container_name: llm-eval-analytics
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/llm_evaluation
      - REDIS_URL=redis://redis:6379
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    ports:
      - "8003:8003"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./services/analytics:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8003

  # RAG Evaluator Service (NEW!)
  rag-evaluator:
    build:
      context: ./services/rag-evaluator
      dockerfile: Dockerfile
    container_name: llm-eval-rag-evaluator
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/llm_evaluation
      - REDIS_URL=redis://redis:6379
      - RABBITMQ_URL=amqp://admin:admin@rabbitmq:5672/
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - SERVICE_PORT=8004
    ports:
      - "8004:8004"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./services/rag-evaluator:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8004

  # Prometheus for metrics
  prometheus:
    image: prom/prometheus:latest
    container_name: llm-eval-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'

  # Grafana for dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: llm-eval-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=grafana-clock-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - prometheus

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  minio_data:
  prometheus_data:
  grafana_data:

networks:
  default:
    name: llm-eval-network
